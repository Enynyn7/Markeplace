services:
  db:
    image: postgres:16
    container_name: sorteos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB:       sorteos_db
    ports:
      - "5432:5432"
    volumes:
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sorteos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
